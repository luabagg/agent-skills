schemaVersion: 1

providers:
  xai:
    harnessIds:
      pi: xai
      opencode: xai
    discovery:
      kind: pi-list-models
      provider: xai
    modelDefaults:
      reasoning: false
      input: [text, image]
      contextWindow: 128000
      maxTokens: 30000
      cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
    fallbackMetadata:
      grok-4.6:
        includeWhenUndiscovered: true
        reason: Keeps the preferred xAI chat model available when live discovery is unavailable.
        model:
          name: Grok 4.6
          reasoning: true
          input: [text, image]
          contextWindow: 256000
          maxTokens: 64000
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
      grok-4.6-fast:
        includeWhenUndiscovered: true
        reason: Keeps the preferred xAI fast model available when live discovery is unavailable.
        model:
          name: Grok 4.6 Fast
          reasoning: true
          input: [text, image]
          contextWindow: 256000
          maxTokens: 64000
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

  openai-codex:
    harnessIds:
      pi: openai-codex
    discovery:
      kind: pi-list-models
      provider: openai-codex
    modelDefaults:
      reasoning: true
      input: [text, image]
      contextWindow: 272000
      maxTokens: 128000
      cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
    fallbackMetadata:
      gpt-5.6-luna:
        includeWhenUndiscovered: true
        reason: Keeps GPT 5.6 Luna available when Codex discovery is unavailable.
        model:
          name: GPT 5.6 Luna
          reasoning: true
          input: [text, image]
          contextWindow: 272000
          maxTokens: 128000
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
      gpt-5.6-sol:
        includeWhenUndiscovered: true
        reason: Keeps GPT 5.6 Sol available when Codex discovery is unavailable.
        model:
          name: GPT 5.6 Sol
          reasoning: true
          input: [text, image]
          contextWindow: 272000
          maxTokens: 128000
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
      gpt-5.6-terra:
        includeWhenUndiscovered: true
        reason: Keeps GPT 5.6 Terra available when Codex discovery is unavailable.
        model:
          name: GPT 5.6 Terra
          reasoning: true
          input: [text, image]
          contextWindow: 272000
          maxTokens: 128000
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

  cursor:
    harnessIds:
      pi: cursor
    discovery:
      kind: openai-models
      url: http://127.0.0.1:32124/v1/models
    piTransport:
      name: Cursor Subscription
      baseUrl: http://127.0.0.1:32124/v1
      api: openai-completions
      apiKey: local-bridge
      authHeader: true
      compat:
        supportsDeveloperRole: false
        supportsReasoningEffort: false
        supportsStore: false
    modelDefaults:
      reasoning: false
      input: [text, image]
      contextWindow: 1000000
      maxTokens: 256000
      cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
    modelRules:
      - match: -xhigh$
        overrides:
          reasoning: true
          maxTokens: 128000

selectors:
  xai-chat:
    provider: xai
    exact: grok-4.6
  xai-coder:
    provider: xai
    exact: grok-4.6-fast
  openai-luna:
    provider: openai-codex
    exact: gpt-5.6-luna
  openai-sol:
    provider: openai-codex
    exact: gpt-5.6-sol
  openai-terra:
    provider: openai-codex
    exact: gpt-5.6-terra
  cursor-auto:
    provider: cursor
    exact: auto
  cursor-coder:
    provider: cursor
    familyLatest:
      family: composer
      suffix: -fast
      versionScheme: numeric-dotted

piScopes:
  default:
    - xai-chat
    - xai-coder
    - openai-luna
    - openai-sol
    - openai-terra
    - cursor-auto
    - cursor-coder

opencodeRoles:
  advisor: xai-chat
  coder: xai-coder

generatedTargets:
  cursorProvider: harnesses/pi/cursor-provider.json
