schemaVersion: 1

providers:
  xai:
    harnessIds:
      pi: xai
      opencode: xai
    discovery:
      kind: pi-list-models
      provider: xai
    modelDefaults:
      reasoning: false
      input: [text, image]
      contextWindow: 128000
      maxTokens: 30000
      cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
    fallbackMetadata:
      grok-4.6:
        includeWhenUndiscovered: true
        reason: Keeps the preferred xAI chat model available when live discovery is unavailable.
        model:
          name: Grok 4.6
          reasoning: true
          input: [text, image]
          contextWindow: 256000
          maxTokens: 64000
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
      grok-4.6-fast:
        includeWhenUndiscovered: true
        reason: Keeps the preferred xAI fast model available when live discovery is unavailable.
        model:
          name: Grok 4.6 Fast
          reasoning: true
          input: [text, image]
          contextWindow: 256000
          maxTokens: 64000
          cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

  openai-codex:
    harnessIds:
      pi: openai-codex
      opencode: openai
    discovery:
      kind: opencode-list-models
      provider: openai
    modelDefaults:
      reasoning: true
      input: [text, image]
      contextWindow: 1050000
      maxTokens: 128000
      cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

selectors:
  xai-chat:
    provider: xai
    exact: grok-4.6
  xai-coder:
    provider: xai
    exact: grok-4.6-fast
  openai-luna:
    provider: openai-codex
    exact: gpt-6-luna
  openai-sol:
    provider: openai-codex
    exact: gpt-6.1-sol
  openai-astra:
    provider: openai-codex
    exact: gpt-6-astra

piScopes:
  default:
    - openai-sol
    - openai-luna
    - openai-astra
    - xai-chat
    - xai-coder

opencodeRoles:
  primary: openai-sol
  explore: openai-luna
  advisor: openai-sol
  coder: openai-sol
