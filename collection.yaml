name: personal-agent-skills
version: 1

# Personal skills remain directly installable with Skills CLI.
skills:
  local: ./skills
  scope: global
  agents: ["*"]

# Reference-only inventory; harness behavior is declared below.
tools:
  catalog: ./curated-tools.json

# Agentfolio knows only this JSON protocol command. This repository owns all
# harness and platform-specific behavior behind the adapter.
adapters:
  agent-skills:
    executable: node
    args: [./scripts/agentfolio-adapter.mjs]
    timeout: 300000

harnesses:
  global:
    adapter: agent-skills
    actions:
      - action: add-curated-skills
        summary: Install curated third-party skills
        config:
          catalog: ./curated-skills.json
      - action: add-instructions
        summary: Install global agent instructions
        config:
          source: ./AGENTS.global.md

  pi:
    adapter: agent-skills
    actions:
      - action: configure
        summary: Configure Pi packages, extensions, models, and Cursor bridge
        config:
          manifest: ./harnesses/pi.json
          catalog: ./harnesses/catalog.yaml
          lock: ./harnesses/catalog.lock.json

  pi-catalog:
    adapter: agent-skills
    actions:
      - action: configure
        summary: Apply committed Pi model lock, Scope, and providers
        config:
          manifest: ./harnesses/pi.json
          catalog: ./harnesses/catalog.yaml
          lock: ./harnesses/catalog.lock.json

  cursor:
    adapter: agent-skills
    actions:
      - action: add-agents
        summary: Install Cursor agents
        config:
          manifest: ./harnesses/cursor.json
          source: ./harnesses/cursor/agents

  opencode:
    adapter: agent-skills
    actions:
      - action: configure-plugins-and-agents
        summary: Configure OpenCode plugins and agents
        config:
          manifest: ./harnesses/opencode.json
          source: ./harnesses/opencode/agents
          catalog: ./harnesses/catalog.yaml

profiles:
  default:
    skills: true
    harnesses: [global]
  skills:
    skills: true
    harnesses: []
  pi:
    skills: true
    harnesses: [pi]
  pi-catalog:
    skills: false
    harnesses: [pi-catalog]
  cursor:
    skills: true
    harnesses: [cursor]
  opencode:
    skills: true
    harnesses: [opencode]
  all:
    skills: true
    harnesses: [global, pi, cursor, opencode]
